# Delegaris demo: the real Delegaris image against a simulated AWS (moto), with two
# accounts of sample machines. Nothing here touches real AWS; no AWS account is needed.
#
#   docker compose up        (from this folder)
#
# Then open http://localhost:8080 and sign in as admin / admin (administrator),
# dev / dev (a developer: the web team's development machines outright, production only
# with approval) or lead / lead (an ops lead, who approves the developer's requests).
#
# Stop it and remove everything with: docker compose down -v
# (Stopped any other way, the simulated AWS forgets its machines; the next start puts them back.)

x-fake-aws: &fake-aws
  AWS_ENDPOINT_URL: http://moto:5000
  AWS_ACCESS_KEY_ID: testing
  AWS_SECRET_ACCESS_KEY: testing
  AWS_DEFAULT_REGION: eu-west-2

services:
  moto:
    image: motoserver/moto:5.2.5

  delegaris:
    image: goodhallsolutions/delegaris:${DELEGARIS_TAG:-latest}
    # Built for amd64 only; on Apple Silicon and other arm64 machines Docker emulates it.
    platform: linux/amd64
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      <<: *fake-aws
      PUBLIC_URL: http://localhost:${APP_PORT:-8080}
      # Three ready-made sign-ins: admin / admin (administrator), dev / dev (a developer in
      # the web team, with no admin rights and no AWS access of their own) and lead / lead
      # (an ops lead, who approves what the developer asks for in production).
      LOCAL_ADMIN_PASSWORD: admin
      DEMO_USERS: "dev:dev:AWS-Web-Team${DEV_EMAIL:+:${DEV_EMAIL:-}};lead:lead:AWS-Ops-Leads${LEAD_EMAIL:+:${LEAD_EMAIL:-}}"
      LOCAL_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Slack, for trying the reminders for real. Leave unset for a demo without Slack.
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_FALLBACK_CHANNEL: ${SLACK_FALLBACK_CHANNEL:-}
      AWS_DEFAULT_REGIONS: eu-west-2
      INVENTORY_CACHE_SECONDS: "10"
      # Look for keep-ons that have come due every 10 seconds, so the demo is quick to watch.
      KEEP_ON_POLL_SECONDS: "10"
    depends_on:
      - moto

  seed:
    image: goodhallsolutions/delegaris:${DELEGARIS_TAG:-latest}
    # Built for amd64 only; on Apple Silicon and other arm64 machines Docker emulates it.
    platform: linux/amd64
    environment:
      <<: *fake-aws
      APP_URL: http://delegaris:8080
    volumes:
      - ./seed.py:/seed/seed.py:ro
    command: ["python", "/seed/seed.py"]
    depends_on:
      delegaris:
        condition: service_healthy
    restart: "no"
