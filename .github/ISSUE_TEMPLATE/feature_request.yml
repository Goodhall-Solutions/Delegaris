name: An idea or a request
description: Something Delegaris could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need to do
      description: The situation and what you are trying to achieve, rather than how it should look.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The workaround, if there is one.
